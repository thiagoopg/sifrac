# =====================================================
# SIFRAC - Configuração PostgreSQL (Produção/Desenvolvimento)
# =====================================================

spring.application.name=sifrac

# ==================== BANCO POSTGRESQL ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/sifrac
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=sifrac
spring.datasource.password=sifrac123

# PostgreSQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# NUNCA use validate com Flyway — conflita com migrations que adicionam colunas extras
spring.jpa.hibernate.ddl-auto=none

# ==================== FLYWAY ====================
# Executa migrations automaticamente na inicialização
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# ==================== PORTA ====================
server.port=8080

# ==================== UPLOAD ====================
# Diretorio base dos anexos das solicitacoes
app.upload.dir=uploads/solicitacoes

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ==================== LDAP (institucional) ====================
# URL do LDAP institucional - configure via variavel de ambiente LDAP_URL
spring.security.ldap.urls=${LDAP_URL:ldap://localhost:3890}
spring.security.ldap.base.dn=${LDAP_BASE_DN:dc=example,dc=com}
spring.security.ldap.bind.dn=${LDAP_MANAGER_DN:uid=admin,ou=people,dc=example,dc=com}
spring.security.ldap.bind.password=${LDAP_MANAGER_PASSWORD:senha123}

# Mapeamento de roles
# O grupo do LDAP vira claim "memberOf" no token JWT
ldap.authorities.group-search-base=ou=groups
ldap.authorities.group-search-filter=(member={0})
ldap.authorities.group-role-attribute=cn

# ==================== E-MAIL (SMTP) ====================
# Configuração SMTP - Gmail/IFRS
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Template do e-mail (opcional - usar Thymeleaf)
spring.mail.template.path=classpath:/templates/email/