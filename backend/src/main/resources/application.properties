spring.application.name=hcomplementares

# ==================== BANCO H2 (DEV) ====================
spring.datasource.url=jdbc:h2:mem:hcomplementares;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# NUNCA use validate com Flyway — conflita com migrations que adicionam colunas extras
spring.jpa.hibernate.ddl-auto=none

# ==================== FLYWAY ====================
# Executa migrations automaticamente na inicialização
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate REMOVIDO — causa bug: não executa migrations em bancos novos
# clean-disabled=false permite DROP ALL (uso apenas em desenvolvimento)
spring.flyway.clean-disabled=false

# ==================== PORTA ====================
server.port=8080

# ==================== UPLOAD ====================
# Diretorio base dos anexos das solicitacoes (default: uploads/solicitacoes)
app.upload.dir=uploads/solicitacoes

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# Desliga health check LDAP (LDAP real só em produção)
management.health.ldap.enabled=false

# ==================== LOG ====================
logging.level.br.edu.ifrs.poa.hcomplementares=INFO
logging.level.org.hibernate.SQL=WARN

# ==================== SWAGGER (SpringDoc) ====================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json

# ==================== SPRING BOOT ADMIN CLIENT ====================
# Desativado — servidor admin não está rodando em desenvolvimento
spring.boot.admin.client.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans,threaddump
management.endpoint.health.show-details=always

# ==================== UPLOAD DE ARQUIVOS ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== LDAP ====================
ldap.url=${LDAP_URL:ldap://localhost:3890}
ldap.base-dn=${LDAP_BASE_DN:dc=example,dc=com}

ldap.manager-dn=${LDAP_ADMIN_DN:uid=admin,ou=people,dc=example,dc=com}
ldap.manager-password=${LDAP_ADMIN_PASS:senha123}

ldap.user-search-base=${LDAP_SEARCH_BASE_DN:ou=people}
ldap.user-search-filter=${LDAP_USER_FILTER:(uid={0})}

ldap.search-subtree=true

# ==================== EMAIL ====================
# Todos os valores podem ser sobrescritos por variavel de ambiente
# (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, ...) ou por um
# arquivo externo config/application.properties.
# Veja docs/CONFIGURACAO_EMAIL.md.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT:5000}

# Flags de envio
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@seudominio.com}
app.mail.resumo-pendencias-enabled=${MAIL_RESUMO_PENDENCIAS_ENABLED:false}
app.mail.avaliacao-aluno-enabled=${MAIL_AVALIACAO_ALUNO_ENABLED:false}

# URL base para links nos e-mails
app.mail.base-url=${APP_BASE_URL:http://localhost:5173}

# Evita que o /actuator/health fique DOWN quando o SMTP nao estiver configurado.
# Habilite em producao: MAIL_HEALTH_ENABLED=true
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
