# ==================== PERFIL PRODUCAO ====================
# Ative com: SPRING_PROFILES_ACTIVE=prod
#
# As credenciais do SMTP NAO ficam neste arquivo. Configure MAIL_HOST,
# MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD etc. por variavel de ambiente
# ou por um arquivo externo config/application.properties.
# Veja docs/CONFIGURACAO_EMAIL.md.

# Liga o envio de e-mail em producao
app.mail.enabled=true
app.mail.avaliacao-aluno-enabled=true
app.mail.resumo-pendencias-enabled=false

# Em producao faz sentido expor o estado do SMTP no actuator
management.health.mail.enabled=true
